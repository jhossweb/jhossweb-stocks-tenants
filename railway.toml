[build]
builder = "NIXPACKS"
# Nixpacks detecta composer y pnpm automáticamente por el pnpm-lock.yaml,
# pero forzamos el comando de build para que limpie cachés y compile Vite:
buildCommand = "composer install --no-dev --optimize-autoloader --no-scripts && pnpm install --frozen-lockfile && pnpm build"

[deploy]
# Comando que reemplaza a tu entrypoint.sh en cada despliegue:
startCommand = "php artisan migrate --force && php artisan tenants:migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && /start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5