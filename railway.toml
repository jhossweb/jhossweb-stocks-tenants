[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# El entrypoint del Dockerfile ejecuta migraciones centrales, migraciones
# de tenant, sincronización de permisos, caches y luego arranca php-fpm+nginx.
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
